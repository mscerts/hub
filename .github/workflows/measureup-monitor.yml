name: MeasureUp Monitor

on:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC
  workflow_dispatch:

concurrency:
  group: measureup-monitor
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check for new MeasureUp products
        id: monitor
        continue-on-error: true
        run: bash scripts/measureup-check.sh

      - name: Create issue if new products found
        if: steps.monitor.outcome == 'success' && steps.monitor.outputs.new_products == 'true'
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6
        with:
          title: "New MeasureUp Products Detected — ${{ github.run_id }}"
          content-filepath: /tmp/measureup-report.md
          labels: enhancement

      - name: Commit updated MeasureUp baseline
        if: steps.monitor.outcome == 'success' && steps.monitor.outputs.baseline_updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data_files/measureup-products.json
          git diff --cached --quiet || git commit -m "Update MeasureUp product baseline"
          git push

      - name: Create issue if extraction failed
        if: always() && steps.monitor.outcome == 'failure'
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6
        with:
          title: "MeasureUp Extraction Failed — ${{ github.run_id }}"
          content-filepath: /tmp/measureup-error.md
          labels: report, automated

      - name: Fail on extraction errors
        if: always() && steps.monitor.outcome == 'failure'
        run: exit 1
