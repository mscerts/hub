name: MeasureUp Monitor

on:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      force_baseline:
        description: "Accept the products MeasureUp lists now silently (no issue) and skip the too-many-new and too-many-vanished failsafes, for example after MeasureUp renumbered its products or reorganised its catalog at once"
        type: boolean
        default: false

# A run is never cancelled half way through (a newer run waits instead): the
# issue and the baseline commit below belong together.
concurrency:
  group: measureup-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
    env:
      REPORT_FILE: /tmp/measureup-report.md
      ERROR_FILE: /tmp/measureup-error.md
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Check MeasureUp for product changes
        id: check
        env:
          FORCE_BASELINE: ${{ inputs.force_baseline && '1' || '' }}
        run: node scripts/measureup-check.mjs

      # The issue comes BEFORE the baseline commit on purpose. A new product
      # stays "new" until the baseline that records it is on main, so when
      # opening the issue fails the commit below is skipped (it has no
      # status-check function in its condition) and the product is reported
      # again by the next run or by "Re-run failed jobs". Committing first would
      # lose the alert: the product would already be in the baseline. The same
      # holds for a stale link of an exam page: it is remembered in the baseline.
      - name: Create issue if MeasureUp products or exam page links changed
        id: issue
        if: steps.check.outputs.changes_found == 'true'
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6
        with:
          title: "${{ steps.check.outputs.issue_title }}"
          content-filepath: /tmp/measureup-report.md
          labels: enhancement

      # Also runs when only products were retired or renamed: that refreshes the
      # baseline without an issue, so it can never go stale.
      - name: Commit updated MeasureUp baseline
        if: steps.check.outputs.baseline_updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data_files/measureup-products.json
          git diff --cached --quiet && exit 0
          git commit -m "Update MeasureUp product baseline"
          # A push can land on main between the checkout and here: retry on top of it.
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          exit 1

      # ONE issue with a stable title for a failing check: a comment for every
      # further failed run, closed by the next healthy run.
      - name: Create issue if the check failed
        if: failure() && steps.check.outputs.extraction_failed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/failure-issue.mjs raise --title "MeasureUp Monitor Failed" --label bug --file /tmp/measureup-error.md

      - name: Close the failure issue once the check runs again
        if: steps.check.outputs.extraction_failed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/failure-issue.mjs clear --title "MeasureUp Monitor Failed" --label bug --comment "The MeasureUp Monitor ran normally again. Closing this issue."
