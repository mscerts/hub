name: Bing IndexNow

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: indexnow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Get changed content files
        id: changes
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.event.after }}
        run: |
          SITE="https://msfthub.com"
          EMPTY_TREE=$(git hash-object -t tree /dev/null)
          BASE="$EVENT_BEFORE"
          HEAD="${EVENT_AFTER:-HEAD}"

          if [[ -z "$BASE" || "$BASE" == "0000000000000000000000000000000000000000" ]]; then
            BASE="$EMPTY_TREE"
          else
            git cat-file -e "${BASE}^{commit}"
          fi
          git cat-file -e "${HEAD}^{commit}"

          map_url() {
            local file="$1" area code slug remainder
            if [[ "$file" == src/pages/certs/index.astro ]]; then
              printf '%s/certs/\n' "$SITE"
            elif [[ "$file" == src/content/docs/prepare/*.mdx ]]; then
              slug=$(basename -- "$file" .mdx)
              printf '%s/certs/prepare/%s/\n' "$SITE" "${slug,,}"
            elif [[ "$file" == src/content/docs/guide/*.mdx ]]; then
              slug=$(basename -- "$file" .mdx)
              printf '%s/certs/guide/%s/\n' "$SITE" "${slug,,}"
            elif [[ "$file" == src/content/docs/vouchers/*.mdx ]]; then
              slug=$(basename -- "$file" .mdx)
              printf '%s/certs/vouchers/%s/\n' "$SITE" "${slug,,}"
            elif [[ "$file" == src/content/docs/labs/*/*.mdx ]]; then
              remainder=${file#src/content/docs/labs/}
              area=${remainder%%/*}
              code=$(basename -- "$file" .mdx)
              printf '%s/certs/labs/%s/%s/\n' "$SITE" "$area" "${code,,}"
            elif [[ "$file" == src/content/docs/*/*.mdx ]]; then
              remainder=${file#src/content/docs/}
              area=${remainder%%/*}
              code=$(basename -- "$file" .mdx)
              printf '%s/certs/%s/%s/\n' "$SITE" "$area" "${code,,}"
            elif [[ "$file" == src/content/blog/*.mdx ]]; then
              slug=$(basename -- "$file" .mdx)
              printf '%s/news/%s/\n' "$SITE" "$slug"
            elif [[ "$file" == src/pages/index.astro ]]; then
              printf '%s/\n' "$SITE"
            fi
          }

          CHANGES_FILE="$RUNNER_TEMP/indexnow-changes.tsv"
          URLS_FILE="$RUNNER_TEMP/indexnow-urls.txt"
          git diff --name-status --find-renames "$BASE" "$HEAD" > "$CHANGES_FILE"
          : > "$URLS_FILE"

          while IFS=$'\t' read -r status src dst; do
            if [[ "$status" == R* && -n "$dst" ]]; then
              map_url "$src" >> "$URLS_FILE"
              map_url "$dst" >> "$URLS_FILE"
            else
              map_url "$src" >> "$URLS_FILE"
            fi
          done < "$CHANGES_FILE"

          sort -u -o "$URLS_FILE" "$URLS_FILE"
          sed -i '/^$/d' "$URLS_FILE"

          if [[ ! -s "$URLS_FILE" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No content changes to submit"
            exit 0
          fi

          JSON_URLS=$(jq -R -s -c 'split("\n") | map(select(length > 0))' "$URLS_FILE")
          URL_COUNT=$(jq 'length' <<< "$JSON_URLS")
          if (( URL_COUNT > 10000 )); then
            echo "::error::IndexNow URL count exceeds the 10,000 URL request limit"
            exit 1
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "urls=$JSON_URLS" >> "$GITHUB_OUTPUT"
          echo "URLs to submit ($URL_COUNT):"
          cat "$URLS_FILE"

      - name: Submit to IndexNow
        if: steps.changes.outputs.skip != 'true'
        env:
          URLS_JSON: ${{ steps.changes.outputs.urls }}
        run: |
          RESPONSE_FILE="$RUNNER_TEMP/indexnow-response.txt"
          PAYLOAD=$(jq -cn \
            --arg host "msfthub.com" \
            --arg key "f8a11c68fec74da9a136302d38546647" \
            --argjson urls "$URLS_JSON" \
            '{host: $host, key: $key, urlList: $urls}')

          set +e
          HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --output "$RESPONSE_FILE" \
            --write-out '%{http_code}' \
            --connect-timeout 10 \
            --max-time 60 \
            --retry 3 \
            --retry-delay 2 \
            --retry-all-errors \
            --request POST \
            --header "Content-Type: application/json; charset=utf-8" \
            --data "$PAYLOAD" \
            "https://api.indexnow.org/indexnow")
          CURL_EXIT=$?
          set -e

          echo "HTTP $HTTP_CODE"
          cat "$RESPONSE_FILE"
          if (( CURL_EXIT != 0 )); then
            echo "::error::IndexNow request failed with curl exit code $CURL_EXIT"
            exit 1
          fi
          if [[ ! "$HTTP_CODE" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::IndexNow returned HTTP $HTTP_CODE"
            exit 1
          fi
