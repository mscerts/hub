name: Voucher Challenge Monitor

on:
  schedule:
    - cron: "0 9 * * 1" # Monday 09:00 UTC (offset from the other Monday monitors)
  workflow_dispatch:

# A run is never cancelled half way through (a newer run waits instead): the
# issue and the tracker commit below belong together.
concurrency:
  group: voucher-challenge-monitor
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    env:
      REPORT_FILE: /tmp/voucher-challenge-report.md
      ERROR_FILE: /tmp/voucher-challenge-error.md
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Sync voucher challenge tracker
        id: sync
        run: node scripts/voucher-challenge-sync.mjs

      # The issue comes BEFORE the tracker commit on purpose. A challenge is
      # reported as new only until the tracker that records it is on main, so
      # when opening the issue fails the commit below is skipped (it has no
      # status-check function in its condition) and the challenge is reported
      # again by the next run or by "Re-run failed jobs". Committing first would
      # lose the alert: the challenge would already be tracked, and nothing would
      # report the failed issue. The price is a possible duplicate issue when the
      # commit step fails after the issue was opened; a duplicate beats a lost
      # alert.
      - name: Create issue if a new voucher challenge was found
        id: issue
        if: steps.sync.outputs.changes_found == 'true'
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6
        with:
          title: "New Voucher Challenge Detected — ${{ github.run_id }}"
          content-filepath: /tmp/voucher-challenge-report.md
          labels: enhancement

      - name: Commit updated voucher challenge tracker
        if: steps.sync.outputs.baseline_updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data_files/voucher-challenges.json
          git diff --cached --quiet && exit 0
          git commit -m "Update voucher challenge tracker"
          # A push can land on main between the checkout and here: retry on top of it.
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          exit 1

      - name: Create issue if sync failed
        if: failure() && steps.sync.outputs.extraction_failed == 'true'
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6
        with:
          title: "Voucher Challenge Monitor Failed — ${{ github.run_id }}"
          content-filepath: /tmp/voucher-challenge-error.md
          labels: bug
