name: Link Checker

on:
  pull_request:
    paths:
      - "src/content/**"
      - ".github/workflows/link-checker.yml"
      - ".lycheeignore"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.15.1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Build site
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Restore lychee cache
        uses: actions/cache@v6
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Check internal links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        continue-on-error: true
        with:
          fail: false
          jobSummary: false
          args: >-
            --root-dir dist
            --cache
            --max-cache-age 1d
            --exclude-loopback
            --exclude 'https?://.*'
            --timeout 10
            --max-retries 2
            'dist/**/*.html'
          output: lychee/results.md

      - name: Fail PR on internal link errors
        if: github.event_name == 'pull_request' && steps.lychee.outputs.exit_code != 0
        run: exit 1

      - name: Check external links on live site
        if: github.event_name != 'pull_request'
        run: >
          npx --yes linkinator
          "https://msfthub.com"
          "https://msfthub.com/wiki/"
          "https://msfthub.com/vouchers/"
          "https://msfthub.com/guide/introduction/"
          "https://msfthub.com/labs/"
          --skip "https?://(www\\.)?(measureup\\.com|discord\\.gg|discord\\.com|linkedin\\.com|x\\.com|threads\\.net|reddit\\.com|news\\.ycombinator\\.com)"
          --skip "news.ycombinator.com"
          --status-code "403:warn"
          --status-code "429:warn"
          --timeout 10000
          --retry
          --retry-errors
          --retry-errors-count 2

      - name: Create issue on failure
        if: github.event_name != 'pull_request' && steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: "Link Checker Report"
          content-filepath: ./lychee/results.md
          labels: report, automated
