name: Lab Registry Monitor

on:
  schedule:
    # Tuesday 10:10 UTC, after Monday's learnsync runs (the catalog and the module links) so that the data it
    # reads is fresh. Every pusher starts at a different minute (a test keeps it that way); that is only a
    # convenience as runs often start hours late. The push retry below is the protection.
    - cron: "10 10 * * 2"
  workflow_dispatch:
    inputs:
      force_baseline:
        description: "Accept a big drop of the universe silently (use after the 'hands-on pages vanished at once' failsafe stopped a run and the change is real)"
        type: boolean
        default: false
      max_page_reads:
        description: "How many unit pages one run may read to look for demo links (default 1000; a module is never split). Leave empty for the default"
        type: string
        default: ""

# A run is never cancelled half way through (a newer run waits instead): the
# issue and the registry commit below belong together.
concurrency:
  group: lab-registry-monitor
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write
    env:
      REPORT_FILE: /tmp/lab-registry-report.md
      ERROR_FILE: /tmp/lab-registry-error.md
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false

      # The script reads learnsync's data from GitHub (the catalog, the content list and the docs catalog), the
      # course list of the Learn catalog API and, politely, the unit pages of the modules that are new or
      # changed, and opens the issue itself BEFORE the registry is committed below.
      #
      # The running issue is titled "Lab registry: hands-on pages need attention" and lists what needs a person
      # now: pages without an exam, pages a lab page lacks, pages Learn stopped listing that a lab page still
      # links. It is created when the list becomes non-empty, gets a comment when the list changes and is closed
      # with a comment when nothing is left.
      #
      # A failing sync raises one issue titled "Lab registry: the sync failed" (a comment per further failed run,
      # closed by the next healthy run). The registry holds what was last reported, so when the issue step
      # fails this step fails, the commit below is skipped (it has no status-check function in its condition),
      # main keeps the old registry, and the next run derives the same state again.
      - name: Sync the lab registry
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
          CREATE_ISSUES: "1"
          FORCE_BASELINE: ${{ inputs.force_baseline && '1' || '' }}
          MAX_PAGE_READS: ${{ inputs.max_page_reads }}
        run: node scripts/lab-registry-sync.mjs

      - name: Commit updated lab registry
        if: steps.sync.outputs.baseline_updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data_files/lab-registry.json
          git diff --cached --quiet && exit 0
          git commit -m "Update lab registry"
          # A push can land on main between the checkout and here: retry on top of it.
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          exit 1

      # ONE issue with a stable title for a failing sync: a comment for every
      # further failed run, closed by the next healthy run.
      - name: Create issue if the sync failed
        if: failure() && steps.sync.outputs.extraction_failed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/failure-issue.mjs raise --title "Lab registry: the sync failed" --label bug --file /tmp/lab-registry-error.md

      - name: Close the failure issue once the sync runs again
        if: steps.sync.outputs.extraction_failed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/failure-issue.mjs clear --title "Lab registry: the sync failed" --label bug --comment "The lab registry sync ran normally again. Closing this issue."
