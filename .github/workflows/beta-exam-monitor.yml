name: Beta Exam Monitor

on:
  schedule:
    - cron: "0 7 * * *" # Daily 07:00 UTC
  workflow_dispatch:

# A run is never cancelled half way through (a newer run waits instead): the
# issue and the tracker commit below belong together.
concurrency:
  group: beta-exam-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    env:
      REPORT_FILE: /tmp/beta-exam-report.md
      ERROR_FILE: /tmp/beta-exam-error.md
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Check tracked beta exams
        id: check
        run: node scripts/beta-exam-check.mjs

      # The issue comes BEFORE the tracker commit on purpose. A beta exam that
      # went GA is reported only until the tracker that marks it flaggedGA is on
      # main, so when opening the issue fails the commit below is skipped (it has
      # no status-check function in its condition) and the exam is reported again
      # by the next run or by "Re-run failed jobs". Committing first would lose
      # the alert: the exam would already be flagged, and nothing would report
      # the failed issue. The price is a possible duplicate issue when the commit
      # step fails after the issue was opened; a duplicate beats a lost alert.
      - name: Create issue if a beta exam went GA
        id: issue
        if: steps.check.outputs.changes_found == 'true'
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6
        with:
          title: "Beta Exam Status Change Detected — ${{ github.run_id }}"
          content-filepath: /tmp/beta-exam-report.md
          labels: enhancement

      - name: Commit updated beta exam tracker
        if: steps.check.outputs.baseline_updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data_files/beta-exams.json
          git diff --cached --quiet && exit 0
          git commit -m "Update beta exam tracker"
          # A push can land on main between the checkout and here: retry on top of it.
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          exit 1

      - name: Create issue if check failed
        if: failure() && steps.check.outputs.extraction_failed == 'true'
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6
        with:
          title: "Beta Exam Monitor Failed — ${{ github.run_id }}"
          content-filepath: /tmp/beta-exam-error.md
          labels: bug
