name: Learn Catalog Monitor

on:
  schedule:
    - cron: "0 7 * * 1" # Monday 07:00 UTC
  workflow_dispatch:

concurrency:
  group: learn-catalog-monitor
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Sync Microsoft Learn catalog cache
        run: node scripts/learn-catalog-sync.mjs

      - name: Commit updated catalog cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data_files/learn-catalog.json
          git diff --cached --quiet || git commit -m "Update Microsoft Learn catalog cache"
          git diff --cached --quiet || git push

      - name: Write failure report
        if: failure()
        run: |
          {
            echo "# Microsoft Learn Catalog Sync Failed"
            echo
            echo "The scheduled sync of \`src/data_files/learn-catalog.json\` failed."
            echo "The Microsoft Learn catalog API may be down, or its response schema may have changed."
            echo
            echo "Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > /tmp/learn-catalog-error.md

      - name: Create issue on sync failure
        if: failure()
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: "Microsoft Learn Catalog Sync Failed — ${{ github.run_id }}"
          content-filepath: /tmp/learn-catalog-error.md
          labels: enhancement
