name: Sitemap Validator

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.15.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Build site
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Validate sitemap
        id: check
        run: |
          python3 -m http.server 4321 --directory dist >/tmp/sitemap-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 20); do
            curl --silent --fail http://127.0.0.1:4321/ >/dev/null && break
            sleep 0.25
          done
          CHECK_ORIGIN=http://127.0.0.1:4321 REPORT=/tmp/sitemap-report.md bash scripts/sitemap-check.sh

      - name: Raise or update failure issue
        if: failure() && steps.check.outputs.has_issues == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/failure-issue.mjs raise --title "Sitemap Validator Report" \
            --file /tmp/sitemap-report.md \
            --label bug

      - name: Close failure issue after healthy run
        if: steps.check.outputs.has_issues == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/failure-issue.mjs clear --title "Sitemap Validator Report" \
            --comment "Sitemap validation passed cleanly."
