name: Voucher Expiry Check

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v5

      - name: Check for expired vouchers
        id: check
        run: bash scripts/voucher-expiry-check.sh

      - name: Create issue for expired vouchers
        if: steps.check.outputs.expired == 'true'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Expired Vouchers Detected"
          content-filepath: /tmp/voucher-changes.md
          labels: content, automated
