name: Voucher Expiry Check

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Check for expired vouchers
        id: check
        run: bash scripts/voucher-expiry-check.sh

      - name: Create pull request for expired vouchers
        if: steps.check.outputs.expired == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: src/content/docs/vouchers
          branch: automation/expired-vouchers
          commit-message: "Mark expired vouchers"
          title: "Mark expired vouchers"
          body-path: /tmp/voucher-changes.md
          labels: content, automated
